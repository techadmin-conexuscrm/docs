# LAB ONLY. Overrides the repo's docker-compose.yml (with the drafts applied)
# so the same services run on a private docker network with no way out:
#   docker compose -p fslab -f <worktree>/docker-compose.yml -f compose.lab.yml up -d freeswitch event-listener far crm
# Needs LAB (this directory) and LABRUN (scratch dir: audio, pki, results) in
# the environment, and FS_ESL_PASSWORD (a throwaway test value) in
# <worktree>/.env, exactly as PR3 expects on the real box.
# Differences from production, all about the network:
#   - network_mode host -> the internal network "labnet" (no internet, no
#     published ports); the event-listener shares the FreeSWITCH container's
#     network namespace so its 127.0.0.1:8021 works as it does with host mode;
#   - sip_profiles/external.xml is replaced by overlay/external.xml (lab IP,
#     no TLS/WSS, the "kamailio" gateway points at the far-end container);
#   - the image is conexus-fs:lab, built from the same Dockerfile.
# voicemail-api and upload-audio are not started (not touched by the drafts;
# upload-audio would try to reach AWS).
networks:
  labnet:
    internal: true
    ipam:
      config:
        - subnet: 10.88.231.0/24

services:
  freeswitch:
    image: conexus-fs:lab
    build: !reset null
    container_name: fslab-fs
    network_mode: !reset null
    restart: "no"
    networks:
      labnet:
        ipv4_address: 10.88.231.10
    volumes:
      - ${LAB}/overlay/external.xml:/etc/freeswitch/sip_profiles/external.xml:ro
      - ${LAB}/runner:/lab/runner:ro
      - ${LABRUN}/pki:/lab-pki:ro
      - ${LABRUN}/audio:/lab/audio:ro
      - ${LABRUN}/results:/results

  event-listener:
    image: conexus-fs:lab
    container_name: fslab-event-listener
    network_mode: "service:freeswitch"
    restart: "no"

  far:
    image: conexus-fs:lab
    container_name: fslab-far
    restart: "no"
    networks:
      labnet:
        ipv4_address: 10.88.231.20
    volumes:
      - ${LAB}/far-conf:/etc/freeswitch:ro
      - ${LABRUN}/audio:/lab/audio:ro
      - ${LABRUN}/results:/results
    tmpfs:
      - /var/lib/freeswitch
      - /var/log/freeswitch
      - /var/run/freeswitch

  crm:
    image: conexus-fs:lab
    container_name: fslab-crm
    restart: "no"
    working_dir: /lab/mock-crm
    command: ["python3", "-u", "/lab/mock-crm/server.py"]
    networks:
      labnet:
        ipv4_address: 10.88.231.30
        aliases: [api.lab.test, other.lab.test]
    volumes:
      - ${LAB}/mock-crm:/lab/mock-crm:ro
      - ./default_voicemail.wav:/lab/vm/default_voicemail.wav:ro
      - ${LABRUN}/pki:/lab-pki:ro
      - ${LABRUN}/results:/results
